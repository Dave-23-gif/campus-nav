# ============================================================
#  Campus Navigation System — Spring Boot Configuration
# ============================================================

spring.application.name=campus-nav

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/campus_nav?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- CORS (allow frontend during dev) ---
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500

# --- JWT Secret (change in production) ---
jwt.secret=CampusNavBaratonSuperSecretKey2024!
jwt.expiration=86400000
