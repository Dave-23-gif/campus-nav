<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEA Baraton — Campus Navigation</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- ── Header ─────────────────────────────────── -->
<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__dot"></span>
    <span class="topbar__title">UEA Baraton Campus Nav</span>
  </div>
  <nav class="topbar__nav">
    <button class="nav-btn active" data-view="map">Map</button>
    <button class="nav-btn" data-view="admin">Admin</button>
  </nav>
</header>

<!-- ── Map View ───────────────────────────────── -->
<main id="view-map" class="view active">
  <aside class="sidebar">
    <div class="sidebar__section">
      <label class="sidebar__label">Search building</label>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="e.g. Library, Lab, Chapel…" autocomplete="off"/>
        <div id="search-results" class="search-dropdown hidden"></div>
      </div>
    </div>

    <div class="sidebar__section">
      <label class="sidebar__label">Find route</label>
      <select id="route-from" class="select">
        <option value="">— From —</option>
      </select>
      <select id="route-to" class="select" style="margin-top:8px">
        <option value="">— To —</option>
      </select>
      <button id="btn-route" class="btn btn--primary" style="margin-top:12px;width:100%">
        Get shortest route
      </button>
    </div>

    <div id="route-result" class="route-result hidden">
      <div class="route-result__header">
        <span class="route-result__label">Route found</span>
        <span id="route-distance" class="route-result__distance"></span>
      </div>
      <ol id="route-steps" class="route-steps"></ol>
    </div>

    <div id="building-detail" class="building-detail hidden">
      <button class="detail-close" id="btn-close-detail">✕</button>
      <div id="detail-category" class="detail-tag"></div>
      <h2 id="detail-name"></h2>
      <p id="detail-desc"></p>
      <div class="detail-coords">
        <span id="detail-code" class="mono"></span>
      </div>
    </div>
  </aside>

  <!-- Campus Map Canvas -->
  <section class="map-area">
    <div class="map-toolbar">
      <button class="tool-btn" id="btn-zoom-in"  title="Zoom in">+</button>
      <button class="tool-btn" id="btn-zoom-out" title="Zoom out">−</button>
      <button class="tool-btn" id="btn-reset"    title="Reset view">⊙</button>
    </div>
    <canvas id="campus-map"></canvas>
    <div id="tooltip" class="map-tooltip hidden"></div>
  </section>
</main>

<!-- ── Admin View ──────────────────────────────── -->
<main id="view-admin" class="view hidden">
  <div class="admin-wrap">
    <div class="admin-header">
      <h1>Admin Panel</h1>
      <p class="admin-sub">Manage buildings and campus paths</p>
    </div>

    <!-- Login form (shown when not authenticated) -->
    <div id="admin-login" class="card">
      <h2>Sign in</h2>
      <input id="admin-user" type="text"     placeholder="Username" class="field"/>
      <input id="admin-pass" type="password" placeholder="Password" class="field"/>
      <button id="btn-login" class="btn btn--primary">Login</button>
      <p id="login-error" class="error-msg hidden"></p>
    </div>

    <!-- Admin dashboard (shown after login) -->
    <div id="admin-dashboard" class="hidden">
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="buildings">Buildings</button>
        <button class="tab-btn" data-tab="paths">Paths</button>
      </div>

      <!-- Buildings tab -->
      <div id="tab-buildings" class="tab-content active">
        <div class="tab-toolbar">
          <h3>Buildings</h3>
          <button class="btn btn--primary" id="btn-add-building">+ Add building</button>
        </div>
        <table class="data-table" id="buildings-table">
          <thead><tr>
            <th>ID</th><th>Code</th><th>Name</th><th>Category</th><th>Actions</th>
          </tr></thead>
          <tbody id="buildings-tbody"></tbody>
        </table>
      </div>

      <!-- Paths tab -->
      <div id="tab-paths" class="tab-content hidden">
        <div class="tab-toolbar">
          <h3>Paths / Edges</h3>
          <button class="btn btn--primary" id="btn-add-path">+ Add path</button>
        </div>
        <table class="data-table" id="paths-table">
          <thead><tr>
            <th>ID</th><th>From</th><th>To</th><th>Distance (m)</th><th>Path Name</th><th>Actions</th>
          </tr></thead>
          <tbody id="paths-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- ── Modal ──────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal__header">
      <h3 id="modal-title">Add Building</h3>
      <button class="modal__close" id="btn-modal-close">✕</button>
    </div>
    <div id="modal-body" class="modal__body"></div>
    <div class="modal__footer">
      <button class="btn btn--ghost" id="btn-modal-cancel">Cancel</button>
      <button class="btn btn--primary" id="btn-modal-save">Save</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/map.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
